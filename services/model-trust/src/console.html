<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Model Trust Score</title>
  <style>
    :root { color-scheme: light; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --bg: #fafaf9; }
    body { margin: 0; font: 15px/1.45 "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    main { max-width: 880px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 28px; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 24px; }
    form, .result, .ledger { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
    input, select { font: inherit; color: var(--ink); padding: 8px; border: 1px solid var(--line); border-radius: 8px; }
    button { margin-top: 12px; font: inherit; background: #1c1917; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
    .score { font-size: 42px; font-weight: 650; }
    .band { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #f5f5f4; }
    .PRIME { background: #dcfce7; } .GOOD { background: #dbeafe; } .FAIR { background: #fef3c7; } .SUBPRIME { background: #fee2e2; }
    ul { margin: 8px 0 0; padding-left: 18px; }
    .error { color: #b91c1c; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Model Trust Score</h1>
    <p class="lead" id="status">Loading service health…</p>
    <form id="score-form">
      <div class="grid">
        <label>Model <input name="model_name" value="pod-failure-prediction" required /></label>
        <label>Version <input name="model_version" value="1" required /></label>
        <label>Accuracy <input name="accuracy" type="number" min="0" max="1" step="0.01" value="0.91" /></label>
        <label>PSI drift <input name="psi_score" type="number" min="0" step="0.01" value="0.04" /></label>
        <label>Critical CVEs <input name="critical_cves" type="number" min="0" step="1" value="0" /></label>
        <label>Image signed
          <select name="image_signed"><option value="true" selected>yes</option><option value="false">no</option></select>
        </label>
        <label>EU AI Act compliant
          <select name="eu_ai_act_compliant"><option value="true" selected>yes</option><option value="false">no</option></select>
        </label>
      </div>
      <button type="submit">Score this version</button>
    </form>
    <section class="result" id="result" hidden>
      <div class="score" id="score-value"></div>
      <div>Band <span class="band" id="band-value"></span></div>
      <p id="band-meaning"></p>
      <div id="caps"></div>
      <div id="advice"></div>
    </section>
    <section class="ledger">
      <h2>Ledger</h2>
      <p id="ledger-status">No entries yet.</p>
      <table id="history" hidden>
        <thead><tr><th>Seq</th><th>Version</th><th>Score</th><th>Band</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script>
    const status = document.getElementById("status");
    async function refreshHealth() {
      const health = await fetch("/health").then((r) => r.json());
      const bands = await fetch("/api/v1/bands").then((r) => r.json());
      const names = bands.bands.map((b) => b.band + " ≥ " + b.min_score).join(" · ");
      status.textContent = "Engine " + health.engine_version + " · ledger " + (health.ledger_integrity_ok ? "verified" : "BROKEN") + " · " + names;
    }
    async function refreshHistory(model) {
      const res = await fetch("/api/v1/models/" + encodeURIComponent(model) + "/history");
      const ledgerStatus = document.getElementById("ledger-status");
      const table = document.getElementById("history");
      if (res.status === 404) { ledgerStatus.hidden = false; ledgerStatus.textContent = "No entries yet."; table.hidden = true; return; }
      const body = await res.json();
      ledgerStatus.hidden = true;
      table.hidden = false;
      table.querySelector("tbody").innerHTML = body.entries.slice().reverse().map((e) =>
        "<tr><td>" + e.seq + "</td><td>" + e.model_version + "</td><td>" + e.score + "</td><td>" + e.band + "</td></tr>"
      ).join("");
    }
    document.getElementById("score-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = new FormData(event.target);
      const model = data.get("model_name");
      const payload = {
        model_name: model,
        model_version: data.get("model_version"),
        evidence: {
          metrics: { accuracy: Number(data.get("accuracy")), psi_score: Number(data.get("psi_score")) },
          security: { critical_cves: Number(data.get("critical_cves")), image_signed: data.get("image_signed") === "true" },
          signals: { eu_ai_act_compliant: data.get("eu_ai_act_compliant") === "true" }
        }
      };
      const res = await fetch("/api/v1/score/from-evidence", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
      const result = document.getElementById("result");
      if (!res.ok) { result.hidden = false; result.innerHTML = "<p class='error'>Scoring failed (" + res.status + ").</p>"; return; }
      const body = await res.json();
      document.getElementById("score-value").textContent = body.score;
      const band = document.getElementById("band-value");
      band.textContent = body.band;
      band.className = "band " + body.band;
      document.getElementById("band-meaning").textContent = body.band_meaning || "";
      const caps = (body.caps_applied || []).filter((c) => c.binding).map((c) => c.rule);
      document.getElementById("caps").textContent = caps.length ? "Caps: " + caps.join(", ") : "No knockout cap.";
      const top = (body.recommendations || [])[0];
      document.getElementById("advice").textContent = top ? "Next action: " + top.action : "No remediation needed.";
      result.hidden = false;
      refreshHistory(model);
    });
    refreshHealth().then(() => refreshHistory("pod-failure-prediction")).catch((err) => { status.textContent = "Service unreachable: " + err; });
  </script>
</body>
</html>
