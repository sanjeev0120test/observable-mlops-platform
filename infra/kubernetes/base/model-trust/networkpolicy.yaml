---
# Default-deny, then allow only: scrapes from Prometheus, scoring calls from Airflow and
# the self-healing service, and egress to MLflow (tag write-back) + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-trust-default-deny
  namespace: platform
  labels:
    app: model-trust
spec:
  podSelector:
    matchLabels:
      app: model-trust
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-trust-allow
  namespace: platform
  labels:
    app: model-trust
spec:
  podSelector:
    matchLabels:
      app: model-trust
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
        - podSelector:
            matchLabels:
              app: airflow
        - podSelector:
            matchLabels:
              app: self-healing
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mlflow
      ports:
        - protocol: TCP
          port: 5000
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
