name: "Setup Python + uv (locked)"
description: >
  Install the pinned uv, a uv-managed Python, and the requested dependency
  groups from uv.lock into .venv, then put that venv on PATH for later steps.

inputs:
  groups:
    description: "Space-separated dependency groups from pyproject.toml. Empty installs none."
    required: false
    default: ""
  python-version:
    description: "Python version for the venv."
    required: false
    default: "3.14"

outputs:
  cache-hit:
    description: "Whether the uv cache was restored."
    value: ${{ steps.uv.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Compute cache suffix
      id: key
      shell: bash
      env:
        GROUPS: ${{ inputs.groups }}
        PYV: ${{ inputs.python-version }}
      run: |
        suffix="py${PYV}"
        for g in $GROUPS; do suffix="${suffix}-${g}"; done
        echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"

    - name: Install uv
      id: uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.7"
        python-version: ${{ inputs.python-version }}
        enable-cache: "true"
        cache-dependency-glob: uv.lock
        cache-suffix: ${{ steps.key.outputs.suffix }}
        cache-python: "true"

    - name: Sync locked dependency groups
      shell: bash
      env:
        GROUPS: ${{ inputs.groups }}
        PYV: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        args=()
        for g in $GROUPS; do args+=(--group "$g"); done
        uv sync --frozen --no-default-groups --python "$PYV" "${args[@]}"
        echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=${GITHUB_WORKSPACE}/.venv" >> "$GITHUB_ENV"
        .venv/bin/python --version
