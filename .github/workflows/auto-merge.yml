name: auto-merge

# Event-driven squash auto-merge for same-repository and trusted-bot pull requests.
#   PR opened/updated → enable GitHub native auto-merge (merges the moment `ci-ok` passes)
#   ci completed      → direct merge fallback when native auto-merge is unavailable
#   hourly sweep      → catches anything the events missed
# Native auto-merge is only used while main requires status checks; without them GitHub
# would merge before CI runs. Drafts, forks, failing checks, requested changes, and
# non-security major Dependabot bumps stay open. PR code is never checked out.
# GITHUB_TOKEN cannot merge workflow-file changes and its merges do not trigger
# push workflows; set the optional AUTO_MERGE_TOKEN secret (fine-grained PAT or app
# token with contents/pull-requests/workflows write) to lift both limits.

on:
  # zizmor: ignore[dangerous-triggers] — no checkout of PR code; metadata only.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [ci]
    types: [completed]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || 'sweep' }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
        (github.event.pull_request.head.repo.full_name == github.repository ||
         contains(fromJSON('["dependabot[bot]","renovate[bot]","github-actions[bot]"]'), github.event.pull_request.user.login)))
      || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge eligible pull requests
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SELF_CHECK: auto-merge
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          owner="${repo%%/*}"

          log() {
            printf '%s\n' "$*"
            printf -- '- %s\n' "$*" >>"$GITHUB_STEP_SUMMARY"
          }

          trusted_bot() {
            case "$1" in
              "dependabot[bot]" | "app/dependabot" | "renovate[bot]" | "app/renovate" | \
              "github-actions[bot]" | "app/github-actions") return 0 ;;
              *) return 1 ;;
            esac
          }

          required_checks="$(gh api "repos/${repo}/rules/branches/main" \
            --jq '[.[] | select(.type == "required_status_checks")] | length')"

          case "$GITHUB_EVENT_NAME" in
            pull_request_target) numbers="$PR_NUMBER" ;;
            workflow_run)
              numbers="$(jq -r '.workflow_run.pull_requests[]?.number' "$GITHUB_EVENT_PATH")"
              if [[ -z "$numbers" ]]; then
                numbers="$(gh pr list --repo "$repo" --state open --head "$RUN_HEAD_BRANCH" \
                  --json number --jq '.[].number')"
              fi
              ;;
            *) numbers="$(gh pr list --repo "$repo" --state open --limit 100 --json number --jq '.[].number')" ;;
          esac

          checks() {
            jq -c --arg self "$SELF_CHECK" '
              [ .statusCheckRollup[]?
                | if .__typename == "StatusContext" then
                    {name: .context, pending: (.state == "PENDING" or .state == "EXPECTED"),
                     failed: (.state == "FAILURE" or .state == "ERROR")}
                  else
                    {name: .name, pending: (.status != "COMPLETED"),
                     failed: (.conclusion as $c | ["FAILURE","CANCELLED","TIMED_OUT","ACTION_REQUIRED","STARTUP_FAILURE","STALE"] | index($c) != null)}
                  end
                | select(.name != $self) ]
              | {total: length, pending: map(select(.pending)) | length,
                 failed: map(select(.failed)) | length, failing: (map(select(.failed) | .name) | join(", "))}
            ' <<<"$1"
          }

          nonsecurity_major() {
            local meta
            meta="$(gh pr view "$1" --repo "$repo" --json title,body,commits)"
            jq -e '
              ([.commits[]? | .messageHeadline, .messageBody] | join("\n") | contains("version-update:semver-major"))
              and ([.title, (.body // ""), (.commits[]?.messageBody // "")] | join("\n")
                   | test("GHSA-|CVE-|security vulnerability|as a direct security update"; "i") | not)
            ' <<<"$meta" >/dev/null
          }

          touches_workflows() {
            local files
            files="$(gh api --paginate "repos/${repo}/pulls/$1/files" --jq '.[].filename')"
            grep -q '^\.github/workflows/' <<<"$files"
          }

          process() {
            local n="$1" pr title author sha c
            pr="$(gh pr view "$n" --repo "$repo" --json \
              title,state,isDraft,author,headRepositoryOwner,headRefOid,reviewDecision,mergeable,mergeStateStatus,autoMergeRequest,statusCheckRollup)"
            title="$(jq -r .title <<<"$pr")"
            author="$(jq -r '.author.login // ""' <<<"$pr")"
            sha="$(jq -r .headRefOid <<<"$pr")"

            [[ "$(jq -r .state <<<"$pr")" == OPEN ]] || { log "#$n skip: not open"; return 0; }
            [[ "$(jq -r .isDraft <<<"$pr")" == false ]] || { log "#$n skip: draft — $title"; return 0; }
            if [[ "$(jq -r '.headRepositoryOwner.login // ""' <<<"$pr")" != "$owner" ]] && ! trusted_bot "$author"; then
              log "#$n skip: fork from an untrusted author — $title"; return 0
            fi
            if [[ "$(jq -r '.reviewDecision // ""' <<<"$pr")" == CHANGES_REQUESTED ]]; then
              log "#$n skip: changes requested — $title"; return 0
            fi
            if [[ "$author" == "dependabot[bot]" || "$author" == "app/dependabot" ]] && nonsecurity_major "$n"; then
              log "#$n hold: major Dependabot bump without a security advisory — $title"; return 0
            fi
            if [[ "$HAS_PAT" != true ]] && touches_workflows "$n"; then
              log "#$n hold: changes .github/workflows, which GITHUB_TOKEN cannot merge (set AUTO_MERGE_TOKEN) — $title"
              return 0
            fi

            c="$(checks "$pr")"
            if (( $(jq .failed <<<"$c") > 0 )); then
              gh pr merge "$n" --repo "$repo" --disable-auto >/dev/null 2>&1 || true
              log "#$n hold: failing checks: $(jq -r .failing <<<"$c") — $title"; return 0
            fi

            if (( required_checks > 0 )); then
              if [[ "$(jq -r '.autoMergeRequest != null' <<<"$pr")" == true ]]; then
                log "#$n: auto-merge already enabled — $title"; return 0
              fi
              if gh pr merge "$n" --repo "$repo" --auto --squash --match-head-commit "$sha"; then
                log "#$n: auto-merge enabled; GitHub merges when required checks pass — $title"; return 0
              fi
            fi

            if (( $(jq .total <<<"$c") == 0 || $(jq .pending <<<"$c") > 0 )); then
              log "#$n wait: checks not finished — $title"; return 0
            fi
            if [[ "$(jq -r .mergeable <<<"$pr")" != MERGEABLE ]]; then
              log "#$n wait: $(jq -r '"\(.mergeable) / \(.mergeStateStatus)"' <<<"$pr") — $title"; return 0
            fi
            if gh pr merge "$n" --repo "$repo" --squash --match-head-commit "$sha"; then
              log "#$n merged at ${sha:0:12} — $title"
            else
              log "#$n left open: GitHub refused the merge — $title"
            fi
          }

          [[ -n "${numbers//[[:space:]]/}" ]] || { log "no open pull requests to process"; exit 0; }
          while IFS= read -r n; do
            [[ "$n" =~ ^[0-9]+$ ]] || continue
            process "$n"
          done <<<"$numbers"
