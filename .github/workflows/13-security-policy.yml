name: "13 · UC7 — Security Policy Enforcement (Trivy + Falco + Kyverno)"

on:
  workflow_call:
  workflow_dispatch:

env:
  UC: UC7
  TRIVY_VERSION: v0.76.2
  FALCO_IMAGE: falcosecurity/falco:0.45.2

permissions:
  contents: read

jobs:
  trivy-scan:
    name: "Trivy CVE Scan (platform base images)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      critical_cves: ${{ steps.trivy.outputs.critical_cves }}

    steps:
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - id: day
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.day.outputs.date }}
          restore-keys: trivy-db-

      - name: Trivy scan images (CRITICAL, fixable only)
        id: trivy
        run: |
          set -euo pipefail
          mkdir -p reports
          total=0
          {
            echo "### Trivy — critical fixable CVEs"
            echo "| Image | Critical |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for image in python:3.14-slim postgres:18.6-alpine redis:8.8.4-alpine \
                       prom/prometheus:v3.16.0 grafana/grafana:13.3.0; do
            out="reports/trivy_$(echo "$image" | tr '/:' '__').json"
            trivy image "$image" --image-src remote --scanners vuln \
              --severity CRITICAL --ignore-unfixed --format json --output "$out" --quiet
            n=$(jq '[.Results[]?.Vulnerabilities[]?] | length' "$out")
            echo "$image critical CVEs: $n"
            echo "| \`$image\` | $n |" >> "$GITHUB_STEP_SUMMARY"
            total=$((total + n))
          done
          echo "Total critical CVEs found: $total"
          echo "critical_cves=$total" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (CycloneDX) for the service base image
        run: |
          trivy image python:3.14-slim --image-src remote \
            --format cyclonedx --output reports/sbom_python_slim.cdx.json --quiet
          echo "SBOM components: $(jq '.components | length' reports/sbom_python_slim.cdx.json)"

      - name: Upload scan results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-reports
          path: reports/
          retention-days: 7

  policy-tests:
    name: "Kyverno admission tests + Falco rule validation"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kyverno_blocked: ${{ steps.kyverno.outputs.blocked }}
      falco_rules: ${{ steps.falco.outputs.rules }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-kyverno

      - name: Pull Falco image
        run: docker pull --quiet "$FALCO_IMAGE" &> /tmp/falco-pull.log &

      - name: Kyverno test (expected allow/deny per resource)
        id: kyverno
        run: |
          set -euo pipefail
          kyverno test aiops/policies/kyverno/tests
          # Every case passed, so each expected `fail` result is a violation that was blocked.
          blocked=$(python3 -c "
          import yaml
          t = yaml.safe_load(open('aiops/policies/kyverno/tests/kyverno-test.yaml'))
          print(sum(len(r['resources']) for r in t['results'] if r['result'] == 'fail'))
          ")
          echo "Violations blocked: $blocked"
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"

      - name: Falco validate custom rules (with default ruleset)
        id: falco
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do docker image inspect "$FALCO_IMAGE" &>/dev/null && break; sleep 2; done
          helm_rules="$RUNNER_TEMP/helm-rules"
          mkdir -p "$helm_rules"
          python3 - "$helm_rules" <<'PYEOF'
          import sys, yaml
          values = yaml.safe_load(open("infra/helm/falco/values.yaml"))
          for name, body in values["customRules"].items():
              open(f"{sys.argv[1]}/{name}", "w").write(body)
          PYEOF
          docker run --rm --entrypoint /usr/bin/falco \
            -v "$PWD/aiops/falco:/rules:ro" -v "$helm_rules:/helm-rules:ro" "$FALCO_IMAGE" \
            -V /etc/falco/falco_rules.yaml -V /rules/custom_rules.yml -V /helm-rules/platform_rules.yaml
          rules=$(python3 -c "
          import yaml
          print(sum(1 for d in yaml.safe_load(open('aiops/falco/custom_rules.yml')) if 'rule' in d))
          ")
          test "$rules" -ge 5
          echo "rules=$rules" >> "$GITHUB_OUTPUT"

  eval-gate:
    name: "UC7 Eval Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [trivy-scan, policy-tests]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Collect security metrics + gate
        env:
          CRITICAL_CVES: ${{ needs.trivy-scan.outputs.critical_cves }}
          KYVERNO_BLOCKED: ${{ needs.policy-tests.outputs.kyverno_blocked }}
          FALCO_RULES: ${{ needs.policy-tests.outputs.falco_rules }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          sys.path.insert(0, ".")
          from pathlib import Path
          from eval.scorer import run_eval_gate

          metrics = {
              "trivy_critical_cves": int(os.environ["CRITICAL_CVES"]),
              "kyverno_violations_blocked": int(os.environ["KYVERNO_BLOCKED"]),
              "falco_rules_triggered": int(os.environ["FALCO_RULES"]),
          }
          print("=== UC7 Security Metrics ===")
          for k, v in metrics.items():
              print(f"  {k}: {v}")
          Path("eval-results").mkdir(exist_ok=True)
          Path("eval-results/uc7_metrics.json").write_text(json.dumps(metrics, indent=2))
          run_eval_gate("UC7", metrics, Path("eval-results"))
          PYEOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: eval-uc7
          path: eval-results/uc7*.json
          retention-days: 7
