name: "02 · Data Pipeline (DVC + Synthetic Data + Great Expectations)"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-validate:
    name: "Generate Synthetic Data + Validate"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-python-uv
        with:
          groups: "quality"

      - name: Install DVC
        run: |
          uv tool install "dvc==3.67.1"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Setup DagsHub / DVC remote
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: bash scripts/setup-dagshub.sh

      - name: Run all data generators
        run: |
          python data/synthetic/generate_pod_metrics.py \
            --hours 72 --interval 5 --anomaly-rate 0.03 \
            --output data/synthetic/pod_metrics.parquet \
            --drift-after-hour 48

          python data/synthetic/generate_container_logs.py \
            --hours 24 --logs-per-second 10.0 \
            --output data/synthetic/container_logs.ndjson

          python data/synthetic/generate_cost_data.py \
            --days 30 --anomaly-rate 0.04 \
            --output data/synthetic/cost_data.parquet

          python data/synthetic/generate_alerts.py \
            --hours 24 --incidents-per-hour 2.0 \
            --output data/synthetic/alerts.parquet

          python data/synthetic/generate_http_traffic.py \
            --hours 72 --interval 60 \
            --output data/synthetic/http_traffic.parquet

      - name: Run data validation
        run: python scripts/validate_data.py

      - name: Great Expectations quality suites (pod_metrics, cost_data, alerts)
        run: |
          python3 - <<'EOF'
          import sys
          import pandas as pd
          sys.path.insert(0, ".")
          from eval.data_quality import between, in_set, not_null, unique, validate

          NAMESPACES = ["payments", "auth", "catalog", "recommendations", "gateway", "ml-serving"]
          suites = {
              "pod_metrics": {
                  "cpu_range": between("cpu_usage_pct", 0, 100),
                  "mem_range": between("mem_usage_pct", 0, 100),
                  "ns_not_null": not_null("namespace"),
                  "pod_not_null": not_null("pod_name"),
                  "ns_set": in_set("namespace", NAMESPACES),
                  "restart_non_neg": between("restart_count", 0, 10000),
              },
              "cost_data": {
                  "cost_positive": between("hourly_cost_usd", 0, 1000),
                  "waste_ratio_range": between("waste_ratio", 0, 1),
                  "team_not_null": not_null("team_label"),
                  "ns_not_null": not_null("namespace"),
              },
              "alerts": {
                  "alert_id_unique": unique("alert_id"),
                  "alertname_not_null": not_null("alertname"),
                  "root_cause_not_null": not_null("root_cause_id"),
                  "severity_values": in_set("severity", ["warning", "critical"]),
              },
          }

          alerts = pd.read_parquet("data/synthetic/alerts.parquet")
          dup_rate = float(alerts["is_duplicate"].mean())
          assert dup_rate > 0.30, f"Expected >30% duplicate alerts for UC3, got {dup_rate:.2f}"

          failed = []
          for name, checks in suites.items():
              df = alerts if name == "alerts" else pd.read_parquet(f"data/synthetic/{name}.parquet")
              results = validate(df, checks)
              failed += [f"{name}.{k}" for k, ok in results.items() if not ok]
              print(f"{name}: {sum(results.values())}/{len(results)} GE expectations passed")
          if failed:
              raise SystemExit(f"GE expectations failed: {failed}")
          print(f"alerts dup_rate={dup_rate:.2f}")
          EOF

      - name: Print dataset stats
        run: |
          python3 - <<'EOF'
          import pandas as pd, json
          from pathlib import Path

          for fname in ["pod_metrics.parquet", "cost_data.parquet", "alerts.parquet", "http_traffic.parquet"]:
              df = pd.read_parquet(f"data/synthetic/{fname}")
              print(f"\n=== {fname} ===")
              print(f"  Rows: {len(df)}, Cols: {len(df.columns)}")
              if "is_anomaly" in df.columns:
                  rate = df["is_anomaly"].mean()
                  print(f"  Anomaly rate: {rate:.2%}")

          logs = len(Path("data/synthetic/container_logs.ndjson").read_text().splitlines())
          print(f"\n=== container_logs.ndjson ===\n  Lines: {logs}")
          EOF

      - name: DVC push (if DagsHub token available)
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -n "${DAGSHUB_TOKEN}" ] && command -v dvc &>/dev/null; then
            dvc add data/synthetic/*.parquet data/synthetic/*.ndjson || true
            dvc push || echo "[DVC] Push skipped (no remote or token)"
          else
            echo "[DVC] Skipping push: token or dvc not available"
          fi

      - name: Upload data artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: synthetic-data
          path: |
            data/synthetic/*.parquet
            data/synthetic/*.ndjson
            data/synthetic/validation_report.json
          retention-days: 1
