name: "25 · UC19 — Feature Monitoring (Evidently profiles + constraint tests)"

on:
  workflow_call:
  workflow_dispatch:

env:
  UC: UC19

permissions:
  contents: read

jobs:
  feature-monitoring:
    name: "Evidently Profiles + Constraint Violations"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-python-uv
        with:
          groups: "quality"

      - name: Generate data
        run: python data/synthetic/generate_pod_metrics.py --hours 24 --output /tmp/pod_metrics.parquet

      - name: Evidently profiling + violation detection
        run: |
          python3 - <<'PYEOF'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from evidently import Report
          from evidently.metrics import DriftedColumnsCount, MaxValue, MinValue
          from evidently.presets import DataDriftPreset
          from evidently.tests import gte, lte

          COLS = ["cpu_usage_pct", "mem_usage_pct", "restart_count"]
          df = pd.read_parquet("/tmp/pod_metrics.parquet")[COLS]
          reference = df.iloc[:2000].reset_index(drop=True)
          clean = df.iloc[2000:4000].reset_index(drop=True)

          # Injected faults the monitor must catch: out-of-range CPU + a memory shift.
          current = clean.copy()
          current.loc[:10, "cpu_usage_pct"] = 150.0
          current["mem_usage_pct"] = np.clip(current["mem_usage_pct"] * 1.6, 0, 100)

          def bounds():
              return [MaxValue(column=c, tests=[lte(100)]) for c in ("cpu_usage_pct", "mem_usage_pct")] + [
                  MinValue(column=c, tests=[gte(0)]) for c in COLS
              ]

          def failed(snapshot):
              return [
                  t["name"] for t in snapshot.dict()["tests"]
                  if str(getattr(t["status"], "value", t["status"])) == "FAIL"
              ]

          # Negative control: clean data must not trip the range constraints.
          control = Report(bounds(), include_tests=True).run(current_data=clean, reference_data=reference)
          false_positives = failed(control)
          assert not false_positives, f"constraints fire on clean data: {false_positives}"

          report = Report([DataDriftPreset(columns=COLS), DriftedColumnsCount(columns=COLS)])
          drift = report.run(current_data=current, reference_data=reference)
          drift_share = next(
              m["value"]["share"] for m in drift.dict()["metrics"]
              if m["metric_name"].startswith("DriftedColumnsCount")
          )

          checks = Report(bounds(), include_tests=True).run(current_data=current, reference_data=reference)
          violations = failed(checks)
          for name in violations:
              print(f"  VIOLATION  {name}")

          Path("eval-results").mkdir(exist_ok=True)
          drift.save_html("eval-results/uc19_profile.html")

          metrics = {
              "profiles_generated": Path("eval-results/uc19_profile.html").stat().st_size > 0,
              "constraint_violations_detected": len(violations),
              "drift_flagged": drift_share >= 0.5,
              "drifted_column_share": round(drift_share, 4),
          }
          print("\n=== UC19 Feature Monitoring Metrics ===")
          for k, v in metrics.items():
              print(f"  {k}: {v}")
          Path("eval-results/uc19_metrics.json").write_text(json.dumps(metrics, indent=2))
          PYEOF

      - name: Run eval gate (UC19)
        run: |
          python3 - <<'PYEOF'
          import sys, json
          sys.path.insert(0, '.')
          from pathlib import Path
          from eval.scorer import run_eval_gate

          metrics = json.loads(Path("eval-results/uc19_metrics.json").read_text())
          run_eval_gate("UC19", metrics, Path("eval-results"))
          PYEOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: eval-uc19
          path: eval-results/uc19*.json
          retention-days: 7
