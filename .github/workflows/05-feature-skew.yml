name: "05 · UC5 — Feature Store + Training-Serving Skew (Feast + GE)"

on:
  workflow_call:
  workflow_dispatch:

env:
  UC: UC5

permissions:
  contents: read

jobs:
  feature-skew:
    name: "Feast Materialize + Skew Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same tag as the compose stack, so Dependabot's compose bumps are what UC5 tests.
      - name: Start Redis (online store)
        run: |
          set -euo pipefail
          image=$(awk '$1 == "image:" && $2 ~ /^redis:/ { print $2; exit }' \
            infra/docker-compose/docker-compose.mlops-core.yml)
          test -n "$image"
          echo "Redis image: $image"
          docker run -d --name redis -p 6379:6379 "$image"

      - uses: ./.github/actions/setup-python-uv
        with:
          groups: "feature-store"

      - name: Generate synthetic data
        run: |
          python data/synthetic/generate_pod_metrics.py \
            --hours 72 --interval 5 \
            --output data/synthetic/pod_metrics.parquet \
            --drift-after-hour 48

          python data/synthetic/generate_cost_data.py \
            --days 30 \
            --output data/synthetic/cost_data.parquet

      - name: Feast apply (register feature definitions)
        working-directory: mlops/feature-store/feature_repo
        run: |
          mkdir -p data/feature_store
          # Point the online store at the job's Redis service instead of the compose hostname.
          sed -i 's|connection_string: "redis:6379,db=0"|connection_string: "localhost:6379,db=0"|' feature_store.yaml
          grep -q 'localhost:6379' feature_store.yaml
          for _ in $(seq 1 30); do
            [ "$(docker exec redis redis-cli ping 2>/dev/null)" = PONG ] && break
            sleep 1
          done
          docker exec redis redis-cli ping
          feast apply

      - name: Materialize + compare offline vs online (skew detection)
        run: |
          python mlops/feature-store/skew_check.py \
            --repo mlops/feature-store/feature_repo \
            --out eval-results/uc5_metrics.json

      - name: Great Expectations — feature validation
        run: |
          python3 - <<'PYEOF'
          import json, sys
          sys.path.insert(0, ".")
          from pathlib import Path
          import pandas as pd
          from eval.data_quality import between, in_set, not_null, validate

          df = pd.read_parquet("data/synthetic/pod_metrics.parquet")
          checks = validate(df, {
              "cpu_range": between("cpu_usage_pct", 0, 100),
              "mem_range": between("mem_usage_pct", 0, 100),
              "restart_non_neg": between("restart_count", 0, 1000),
              "ready_not_null": not_null("ready_status"),
              "ns_in_set": in_set(
                  "namespace",
                  ["payments", "auth", "catalog", "recommendations", "gateway", "ml-serving"],
              ),
          })
          for name, ok in checks.items():
              print(f"  {'PASS' if ok else 'FAIL'}  {name}")
          ge_pct = sum(checks.values()) / len(checks)
          print(f"GE passed {sum(checks.values())}/{len(checks)} = {ge_pct:.2%}")

          out = Path("eval-results/uc5_metrics.json")
          metrics = json.loads(out.read_text())
          metrics["ge_validation_success_pct"] = ge_pct
          out.write_text(json.dumps(metrics, indent=2))
          PYEOF

      - name: Run eval gate (UC5)
        run: |
          python3 - <<'PYEOF'
          import sys, json
          sys.path.insert(0, '.')
          from pathlib import Path
          from eval.scorer import run_eval_gate

          metrics = json.loads(Path("eval-results/uc5_metrics.json").read_text())
          run_eval_gate("UC5", metrics, Path("eval-results"))
          PYEOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: eval-uc5
          path: eval-results/uc5*.json
          retention-days: 7
