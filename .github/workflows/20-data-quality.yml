name: "20 · UC13 — Data Pipeline Quality Gates (Great Expectations + Airflow)"

on:
  workflow_call:
  workflow_dispatch:

env:
  UC: UC13

permissions:
  contents: read

jobs:
  data-quality:
    name: "GE Validation + Bad Data Blocking"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-python-uv
        with:
          groups: "quality"

      - name: Generate data
        run: python data/synthetic/generate_pod_metrics.py --hours 24 --output /tmp/pod_metrics.parquet

      - name: GE validation suite + bad data test
        run: |
          python3 - <<'PYEOF'
          import json, sys
          sys.path.insert(0, ".")
          from pathlib import Path
          import pandas as pd
          from eval.data_quality import between, in_set, not_null, validate

          NAMESPACES = ["payments", "auth", "catalog", "recommendations", "gateway", "ml-serving"]
          SUITE = {
              "cpu_range": between("cpu_usage_pct", 0, 100),
              "mem_range": between("mem_usage_pct", 0, 100),
              "ns_in_set": in_set("namespace", NAMESPACES),
              "pod_not_null": not_null("pod_name"),
              "restart_non_neg": between("restart_count", 0, 10000),
          }
          SCHEMA = {
              "cpu_usage_pct": "float", "mem_usage_pct": "float", "restart_count": "integer",
              "namespace": "string", "pod_name": "string", "timestamp": "datetime64",
          }

          df = pd.read_parquet("/tmp/pod_metrics.parquet")
          schema_ok = all(
              col in df.columns and pd.api.types.infer_dtype(df[col], skipna=True).startswith(kind)
              for col, kind in SCHEMA.items()
          )
          checks = validate(df, SUITE)
          ge_pass_rate = sum(checks.values()) / len(checks)

          # Each injected defect must be caught by its expectation.
          bad_df = pd.DataFrame({
              "cpu_usage_pct": [150.0, -5.0],
              "mem_usage_pct": [50.0, 60.0],
              "restart_count": [0, 0],
              "namespace": ["invalid_ns", "payments"],
              "pod_name": ["pod-01", None],
          })
          bad = validate(bad_df, SUITE)
          bad_data_blocked = not (bad["cpu_range"] or bad["ns_in_set"] or bad["pod_not_null"])

          metrics = {
              "ge_expectations_passed_pct": round(ge_pass_rate, 4),
              "bad_data_blocked": bad_data_blocked,
              "schema_validation_pass": schema_ok,
          }

          print(f"clean: {checks}")
          print(f"bad:   {bad}")
          print(f"schema ok: {schema_ok}")
          print(f"GE pass rate: {ge_pass_rate:.2%}, bad data blocked: {bad_data_blocked}")
          Path("eval-results").mkdir(exist_ok=True)
          Path("eval-results/uc13_metrics.json").write_text(json.dumps(metrics, indent=2))
          PYEOF

      - name: Run eval gate (UC13)
        run: |
          python3 - <<'PYEOF'
          import sys, json
          sys.path.insert(0, '.')
          from pathlib import Path
          from eval.scorer import run_eval_gate

          metrics = json.loads(Path("eval-results/uc13_metrics.json").read_text())
          run_eval_gate("UC13", metrics, Path("eval-results"))
          PYEOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: eval-uc13
          path: eval-results/uc13*.json
          retention-days: 7
