name: "28 · SBOM Generation + Container Image Signing"

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "infra/docker-compose/**"
      - "requirements.txt"
      - "pyproject.toml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  sbom-and-sign:
    timeout-minutes: 2
    name: "SBOM + Cosign Image Signing"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # Required for OIDC-based keyless signing with Cosign

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: latest

      - name: Install Grype (vulnerability scanner)
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2

      - name: Generate Python dependency SBOM (SPDX)
        run: |
          # Directory scan of the whole repo (picks up requirements.txt / pyproject
          # deps). No --config needed: the default catalogers cover a filesystem scan,
          # and `--config -` (stdin) is not a valid syft config source.
          syft scan dir:. --output spdx-json=sbom-python.spdx.json
          python3 -c "import json; print('SBOM generated:', len(json.load(open('sbom-python.spdx.json')).get('packages', [])), 'packages')"

      - name: Scan SBOM for known vulnerabilities
        run: |
          grype sbom:sbom-python.spdx.json \
            --fail-on critical \
            --output table \
            --quiet
        continue-on-error: true  # Report but don't block — track via security dashboard

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: platform-sbom
          path: |
            sbom-python.spdx.json
          retention-days: 90

      - name: Upload SBOM to GitHub Dependency Graph
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          sbom-artifact-match: "sbom-*.spdx.json"
          artifact-name: platform-sbom-${{ github.sha }}.spdx.json

  trivy-image-scan:
    timeout-minutes: 2
    name: "Trivy Container Security Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required by upload-sarif to write to the code-scanning API
    strategy:
      matrix:
        service: [anomaly-detector, drift-monitor, alert-correlator, self-healing, runbook-agent, cost-optimizer, predictive-scaler, model-trust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Trivy on ${{ matrix.service }} Dockerfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "services/${{ matrix.service }}"
          format: "sarif"
          output: "trivy-${{ matrix.service }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # Don't fail build — report to Security tab
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        continue-on-error: true  # Report to the Security tab; don't block if code scanning is unavailable
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
