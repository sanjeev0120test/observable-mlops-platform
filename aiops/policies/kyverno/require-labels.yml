apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-team-labels
  annotations:
    policies.kyverno.io/title: Require Team Labels
    policies.kyverno.io/description: >
      All Deployments, StatefulSets, and DaemonSets must have
      'app.kubernetes.io/team' and 'app.kubernetes.io/uc' labels
      for cost attribution (UC10) and DORA metrics (UC15).
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
  matchConditions:
    - name: team-namespaces
      expression: >-
        object.metadata.namespace in
        ['payments', 'auth', 'catalog', 'recommendations', 'gateway', 'ml-serving']
  variables:
    - name: labels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
  validations:
    - expression: "variables.labels[?'app.kubernetes.io/team'].orValue('') != ''"
      message: "Label 'app.kubernetes.io/team' is required for cost attribution."
    - expression: >-
        object.metadata.namespace != 'ml-serving' || object.kind == 'DaemonSet' ||
        variables.labels[?'app.kubernetes.io/uc'].orValue('') != ''
      message: "Label 'app.kubernetes.io/uc' is required for ML serving workloads."
